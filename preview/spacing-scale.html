<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&display=swap">
<style>
  body { margin: 0; padding: 24px; font-family: 'Open Sans', system-ui, sans-serif; background: white; color: #1f2937; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .row { display: grid; grid-template-columns: 90px 60px 1fr; gap: 16px; align-items: center; }
  .name { font-size: 12px; font-family: ui-monospace, monospace; color: #83899f; }
  .px { font-size: 12px; color: #1f2937; font-weight: 500; }
  .bar { background: #1f2937; height: 14px; border-radius: 2px; }
  .caption { font-size: 11px; color: #6b7280; padding-top: 8px; border-top: 1px solid #e1e4e8; }
</style>
</head>
<body>
  <div class="stack">
    <div class="row"><span class="name">--space-1</span><span class="px">8 px</span><span class="bar" style="width: 8px;"></span></div>
    <div class="row"><span class="name">--space-2</span><span class="px">16 px</span><span class="bar" style="width: 16px;"></span></div>
    <div class="row"><span class="name">--space-3</span><span class="px">24 px</span><span class="bar" style="width: 24px;"></span></div>
    <div class="row"><span class="name">--space-4</span><span class="px">32 px</span><span class="bar" style="width: 32px;"></span></div>
    <div class="row"><span class="name">--space-5</span><span class="px">40 px</span><span class="bar" style="width: 40px;"></span></div>
    <div class="row"><span class="name">--space-6</span><span class="px">48 px</span><span class="bar" style="width: 48px;"></span></div>
    <div class="caption">8px rhythm. Every multiple of 8 is a valid snap target. Snap threshold is 8px.</div>
  </div>
</body>
</html>
