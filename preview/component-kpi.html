<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0">
<style>
  body { margin: 0; padding: 20px; font-family: 'Open Sans', system-ui, sans-serif; background: white; color: #1f2937; }
  .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; align-items: stretch; }
  .kpi-card {
    background: #fefefe;
    border: 1px solid #e1e4e8;
    border-radius: 8px;
    padding: 24px;
    width: 100%;
    height: 140px;
    display: flex;
    flex-direction: column;
  }
  .kpi-label { font-size: 14px; color: #6b7280; margin: 0; line-height: 1.3; }
  .kpi-value { font-size: 32px; color: #1f2937; font-weight: 600; margin: auto 0; line-height: 1.15; }
  .kpi-delta {
    font-size: 12px; margin: 0; display: flex; align-items: center; gap: 4px; line-height: 1.3;
  }
  .kpi-delta-change { display: inline-flex; align-items: center; gap: 4px; font-weight: 500; }
  .kpi-delta-icon { font-size: 14px; font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24; line-height: 1; }
  .kpi-delta-context { color: #83899f; }
  .up .kpi-delta-change { color: #10b981; }
  .down .kpi-delta-change { color: #800F2F; }
</style>
</head>
<body>
  <div class="row">
    <div class="kpi-card up">
      <p class="kpi-label">Profit</p>
      <p class="kpi-value">£4.71M</p>
      <p class="kpi-delta">
        <span class="kpi-delta-change">
          <span class="material-symbols-outlined kpi-delta-icon">north_east</span>+9%
        </span>
        <span class="kpi-delta-context">Vs Last Year</span>
      </p>
    </div>
    <div class="kpi-card down">
      <p class="kpi-label">Returning Customer Rate</p>
      <p class="kpi-value">66%</p>
      <p class="kpi-delta">
        <span class="kpi-delta-change">
          <span class="material-symbols-outlined kpi-delta-icon">south_east</span>-2%
        </span>
        <span class="kpi-delta-context">Vs Last Year</span>
      </p>
    </div>
  </div>
</body>
</html>
