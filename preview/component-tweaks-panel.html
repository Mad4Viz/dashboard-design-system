<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&display=swap">
<style>
  body { margin: 0; padding: 16px; font-family: 'Open Sans', system-ui, sans-serif; background: #f9fafb; color: #1f2937; }
  .panel {
    background: #fefefe;
    border: 1px solid #e1e4e8;
    border-radius: 8px;
    padding: 16px;
    width: 280px;
  }
  .eyebrow { font-size: 11px; color: #83899f; margin: 0 0 4px 0; }
  h2 { font-size: 16px; margin: 0 0 12px 0; font-weight: 600; }
  .section-label {
    font-size: 10px; color: #83899f;
    text-transform: uppercase; letter-spacing: 0.06em;
    margin: 12px 0 6px 0;
  }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row label { flex: 1; font-size: 14px; }
  .add-btn {
    display: block; width: 100%; margin-top: 12px;
    padding: 8px 12px;
    background: #fefefe; border: 1px solid #e1e4e8;
    border-radius: 8px; font-size: 14px;
    color: #1f2937; text-align: center;
    cursor: pointer;
  }
  input[type="checkbox"] { accent-color: #1f2937; }
</style>
</head>
<body>
  <div class="panel">
    <p class="eyebrow">Design System</p>
    <h2>Tweaks Panel</h2>
    <p class="section-label">Canvas</p>
    <div class="row"><input type="checkbox"><label>5.1 Grid overlay</label></div>
    <div class="row"><input type="checkbox" checked><label>5.2 Snap to grid</label></div>
    <div class="row"><input type="checkbox"><label>5.3 Show all dimensions</label></div>
    <div class="row"><input type="checkbox"><label>5.8 Padding (24px)</label></div>
    <button class="add-btn" type="button">+ Add component</button>
  </div>
</body>
</html>
