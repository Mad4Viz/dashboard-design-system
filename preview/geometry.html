<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&display=swap">
<style>
  body { margin: 0; padding: 24px; font-family: 'Open Sans', system-ui, sans-serif; background: white; color: #1f2937; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .item { display: flex; flex-direction: column; gap: 8px; }
  .visual {
    height: 80px;
    background: #fefefe;
    border: 1px solid #e1e4e8;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .r4 { border-radius: 4px; }
  .r8 { border-radius: 8px; }
  .r50 { width: 32px; height: 32px; border-radius: 50%; background: #fefefe; border: 1px solid #e1e4e8; padding: 0; }
  .name { font-size: 12px; font-family: ui-monospace, monospace; color: #1f2937; font-weight: 500; }
  .meta { font-size: 11px; color: #83899f; }
  .swatch { background: #f9fafb; }
</style>
</head>
<body>
  <div class="grid">
    <div class="item">
      <div class="visual r8 swatch"></div>
      <div class="name">--radius-card · 8px</div>
      <div class="meta">All cards, sidebar fill, Tweaks panel</div>
    </div>
    <div class="item">
      <div class="visual r4 swatch"></div>
      <div class="name">4px</div>
      <div class="meta">Dropdown chips, dim labels, nav rows</div>
    </div>
    <div class="item">
      <div class="visual" style="background: transparent; border: none; justify-content: flex-start;">
        <span class="r50"></span>
        <span class="r50" style="margin-left: 8px; background: #2db463; border-color: #2db463; width: 8px; height: 8px;"></span>
      </div>
      <div class="name">50% · 1px solid</div>
      <div class="meta">Remove handle (20px), status dot (8px). --card-border-width: 1px.</div>
    </div>
  </div>
</body>
</html>
