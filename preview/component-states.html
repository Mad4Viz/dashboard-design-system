<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&display=swap">
<style>
  body { margin: 0; padding: 20px; font-family: 'Open Sans', system-ui, sans-serif; background: #f9fafb; color: #1f2937; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .stage { display: flex; flex-direction: column; gap: 8px; }
  .label-row { font-size: 11px; color: #83899f; font-family: ui-monospace, monospace; }
  .card {
    position: relative;
    width: 100%;
    height: 100px;
    background: #fefefe;
    border: 1px solid #e1e4e8;
    border-radius: 8px;
    padding: 16px;
  }
  .card-title {
    font-size: 14px;
    color: #1f2937;
    margin: 0;
    padding: 2px 4px;
    margin-left: -4px;
    border-radius: 4px;
  }
  .card-title.focused {
    background: #f9fafb;
    box-shadow: inset 0 0 0 1px #e1e4e8;
    outline: none;
  }
  .card-subtitle {
    font-size: 12px;
    color: #83899f;
    margin: 2px 0 0 0;
    padding: 2px 4px;
    margin-left: -4px;
  }
  .dim-label {
    position: absolute;
    top: 4px; right: 4px;
    font-size: 12px;
    color: #83899f;
    background: #f9fafb;
    border: 1px solid #e1e4e8;
    border-radius: 4px;
    padding: 2px 6px;
  }
  .resize-handle {
    position: absolute;
    bottom: 0; right: 0;
    width: 14px; height: 14px;
    background: #83899f;
    opacity: 0.7;
    border-top-left-radius: 4px;
  }
  .remove-handle {
    position: absolute;
    top: 4px; left: 4px;
    width: 20px; height: 20px;
    background: #fefefe;
    border: 1px solid #e1e4e8;
    border-radius: 50%;
    font-size: 14px;
    color: #83899f;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>
  <div class="grid">
    <div class="stage">
      <div class="card">
        <span class="remove-handle">×</span>
        <p class="card-title">Top 5 Products</p>
        <p class="card-subtitle">2025</p>
      </div>
      <div class="label-row">.remove-handle · hover-revealed</div>
    </div>
    <div class="stage">
      <div class="card">
        <p class="card-title focused" contenteditable="true">Edit me</p>
        <p class="card-subtitle">Inline-editable</p>
      </div>
      <div class="label-row">title:focus · click to edit</div>
    </div>
    <div class="stage">
      <div class="card">
        <span class="dim-label">270 × 160</span>
        <p class="card-title">Profit</p>
        <p class="card-subtitle">KPI</p>
        <span class="resize-handle"></span>
      </div>
      <div class="label-row">.dim-label + .resize-handle</div>
    </div>
  </div>
</body>
</html>
