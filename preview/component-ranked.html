<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&display=swap">
<style>
  body { margin: 0; padding: 16px; font-family: 'Open Sans', system-ui, sans-serif; background: #f9fafb; color: #1f2937; }
  .chart-card {
    width: 100%;
    background: #fefefe;
    border: 1px solid #e1e4e8;
    border-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
  }
  .card-header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .card-title { font-size: 14px; color: #1f2937; margin: 0 0 2px 0; line-height: 1.3; font-weight: 400; }
  .card-subtitle { font-size: 12px; color: #83899f; margin: 0; line-height: 1.3; }
  .card-filters { display: flex; gap: 16px; }
  .filter-info { display: flex; flex-direction: column; gap: 1px; min-width: 90px; }
  .filter-label { font-size: 10px; color: #83899f; line-height: 1.2; }
  .filter-value { font-size: 11px; color: #1f2937; font-weight: 500; line-height: 1.2; }
  .ranked-list { display: flex; flex-direction: column; gap: 10px; }
  .ranked-row {
    display: grid;
    grid-template-columns: 18px 150px 1fr 70px;
    align-items: center;
    gap: 10px;
  }
  .ranked-icon { width: 14px; height: 14px; color: #83899f; }
  .ranked-text { min-width: 0; }
  .ranked-name { font-size: 12px; color: #1f2937; margin: 0; line-height: 1.25; }
  .ranked-subtitle { font-size: 10px; color: #83899f; margin: 0; line-height: 1.2; }
  .ranked-bar-track { width: 100%; height: 10px; }
  .ranked-bar { height: 10px; background: #D3D3D3; border-radius: 2px; }
  .ranked-value { font-size: 12px; color: #1f2937; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="chart-card">
    <div class="card-header-row">
      <div>
        <p class="card-title">Top 5 Products | Profit</p>
        <p class="card-subtitle">2025</p>
      </div>
      <div class="card-filters">
        <div class="filter-info">
          <span class="filter-label">Toggle Top/Bottom 5</span>
          <span class="filter-value">Top 5 ▾</span>
        </div>
        <div class="filter-info">
          <span class="filter-label">Select a Metric</span>
          <span class="filter-value">Profit ▾</span>
        </div>
      </div>
    </div>
    <div class="ranked-list">
      <div class="ranked-row">
        <svg class="ranked-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
        <div class="ranked-text"><p class="ranked-name">Protein | Milk &amp; Cookies</p><p class="ranked-subtitle">Brand Range</p></div>
        <div class="ranked-bar-track"><div class="ranked-bar" style="width: 100%;"></div></div>
        <span class="ranked-value">£797.72K</span>
      </div>
      <div class="ranked-row">
        <svg class="ranked-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
        <div class="ranked-text"><p class="ranked-name">Protein | Red Velvet</p><p class="ranked-subtitle">Brand Range</p></div>
        <div class="ranked-bar-track"><div class="ranked-bar" style="width: 82.4%;"></div></div>
        <span class="ranked-value">£656.92K</span>
      </div>
      <div class="ranked-row">
        <svg class="ranked-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
        <div class="ranked-text"><p class="ranked-name">Pre-Workout | South Beach Slush</p><p class="ranked-subtitle">Brand Range</p></div>
        <div class="ranked-bar-track"><div class="ranked-bar" style="width: 32.8%;"></div></div>
        <span class="ranked-value">£261.50K</span>
      </div>
    </div>
  </div>
</body>
</html>
