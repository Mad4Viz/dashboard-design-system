<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --font: 'Open Sans', system-ui, sans-serif;
    --card-border: #e1e4e8;
    --text-primary: #1f2937;
    --text-tertiary: #83899f;
  }
  body { margin: 0; padding: 20px; font-family: var(--font); background: white; color: var(--text-primary); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .swatch { display: flex; flex-direction: column; gap: 6px; }
  .chip {
    height: 64px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
  }
  .meta { display: flex; flex-direction: column; gap: 1px; }
  .name { font-size: 12px; color: var(--text-primary); font-weight: 500; }
  .role { font-size: 11px; color: var(--text-tertiary); }
  .hex { font-size: 11px; color: var(--text-tertiary); font-family: ui-monospace, monospace; }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch">
      <div class="chip" style="background: #1f2937;"></div>
      <div class="meta"><span class="name">Chart accent</span><span class="role">Primary series</span><span class="hex">#1f2937</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: #D3D3D3;"></div>
      <div class="meta"><span class="name">Accent secondary</span><span class="role">Comparison series</span><span class="hex">#D3D3D3</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: #f59e0b;"></div>
      <div class="meta"><span class="name">Annotation</span><span class="role">Peak / Max callout</span><span class="hex">#f59e0b</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: rgba(220, 80, 90, 0.18);"></div>
      <div class="meta"><span class="name">Grid band</span><span class="role">Column overlay</span><span class="hex">rgba(220,80,90,.18)</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: rgba(220, 80, 90, 0.10);"></div>
      <div class="meta"><span class="name">Grid row</span><span class="role">Row stripe overlay</span><span class="hex">rgba(220,80,90,.10)</span></div>
    </div>
  </div>
</body>
</html>
