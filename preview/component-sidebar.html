<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0">
<style>
  body { margin: 0; padding: 16px; font-family: 'Open Sans', system-ui, sans-serif; background: #f9fafb; color: #1f2937; }
  .sidebar {
    background: #fefefe;
    border: 1px solid #e1e4e8;
    border-radius: 8px;
    padding: 24px 16px;
    width: 240px;
  }
  .sidebar-logo { color: #000; padding: 0 12px; margin: 0 0 24px 0; height: 24px; }
  .sidebar-logo svg { height: 24px; width: auto; display: block; }

  .sidebar-last-update {
    display: flex; flex-direction: column; gap: 2px;
    font-size: 12px; color: #83899f; padding: 0 12px;
  }
  .sidebar-section { margin-top: 24px; }
  .sidebar-section-label {
    font-size: 12px; color: #83899f; margin: 0;
    padding: 12px 14px;
  }
  .sidebar-section-label--home { font-size: 14px; }
  .sidebar-nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 0 12px; height: 36px;
    font-size: 12px; color: #1a1a1a;
    border-radius: 4px;
  }
  .sidebar-nav-item--active { background: #f8f9fa; font-weight: 600; }
  .sidebar-icon {
    font-size: 22px;
    font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    line-height: 1;
  }
  .sidebar-filter-row { display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; }
  .sidebar-filter-label { font-size: 12px; color: #83899f; font-style: italic; }
  .sidebar-filter-value { font-size: 12px; color: #1f2937; }
</style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 106 24" fill="currentColor" aria-label="RAW">
        <path d="M105.997 0L93.2177 24H83.9615L79.354 15.3452L74.7467 24H65.4903L52.7111 0H64.9037L69.4785 8.59259L73.4312 0H85.6533L89.2325 8.59259L93.8074 0H106H105.997ZM52.2934 3.89629L62.9985 24H50.8059L46.1985 15.3452L41.5911 24H34.3437H19.2266L17.4548 14.1156L12.1925 24H0L12.7792 0H29.1319L35.1111 8.55407L25.834 14.2192L31.277 20.4741L40.1037 3.89629L40.0978 3.88444L40.7467 2.68741L42.1748 0H50.2192L51.6504 2.68741L52.2993 3.88444L52.2934 3.89629ZM24.7497 9.43704L21.4341 6.64L17.4548 14.1156L24.7497 9.43704Z"/>
      </svg>
    </div>
    <div class="sidebar-last-update">
      <span>Last Update</span>
      <span>21.10.25 09:00:00am</span>
    </div>
    <div class="sidebar-section">
      <p class="sidebar-section-label sidebar-section-label--home">Navigation</p>
      <div class="sidebar-nav-item sidebar-nav-item--active">
        <span class="material-symbols-outlined sidebar-icon">grid_view</span>
        Shopify Overview
      </div>
      <div class="sidebar-nav-item">
        <span class="material-symbols-outlined sidebar-icon">browse_activity</span>
        Marketing Spend
      </div>
      <div class="sidebar-nav-item">
        <span class="material-symbols-outlined sidebar-icon">person</span>
        Customer Analysis
      </div>
    </div>
    <div class="sidebar-section">
      <p class="sidebar-section-label">Filter Control</p>
      <div class="sidebar-filter-row">
        <span class="sidebar-filter-label">Select a Metric</span>
        <span class="sidebar-filter-value">Profit</span>
      </div>
      <div class="sidebar-filter-row">
        <span class="sidebar-filter-label">Select a Category</span>
        <span class="sidebar-filter-value">Protein</span>
      </div>
    </div>
  </div>
</body>
</html>
