<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&display=swap">
<style>
  body { margin: 0; padding: 24px; font-family: 'Open Sans', system-ui, sans-serif; background: white; color: #1f2937; }
  .row { display: grid; grid-template-columns: 100px 1fr 90px; gap: 12px; align-items: baseline; padding: 4px 0; }
  .label { font-size: 11px; color: #83899f; font-family: ui-monospace, monospace; }
  .meta { font-size: 11px; color: #83899f; font-family: ui-monospace, monospace; text-align: right; }
  .s12 { font-size: 12px; }
  .s14 { font-size: 14px; }
  .s16 { font-size: 16px; }
  .s18 { font-size: 18px; }
  .s24 { font-size: 24px; font-weight: 600; }
  .s32 { font-size: 32px; font-weight: 600; line-height: 1.15; }
</style>
</head>
<body>
  <div class="row"><span class="label">--size-xs</span><span class="s12">Axis labels, deltas, subtitles</span><span class="meta">12px / 400</span></div>
  <div class="row"><span class="label">--size-sm</span><span class="s14">Card title, KPI label, sidebar</span><span class="meta">14px / 400</span></div>
  <div class="row"><span class="label">--size-base</span><span class="s16">Page subtitle, body</span><span class="meta">16px / 400</span></div>
  <div class="row"><span class="label">(reserved)</span><span class="s18">18 — reserved (was KPI)</span><span class="meta">18px</span></div>
  <div class="row"><span class="label">--size-h1</span><span class="s24">Shopify Overview</span><span class="meta">24px / 600</span></div>
  <div class="row"><span class="label">--size-kpi</span><span class="s32">£4.71M</span><span class="meta">32px / 600</span></div>
</body>
</html>
