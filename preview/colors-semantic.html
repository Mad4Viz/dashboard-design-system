<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --font: 'Open Sans', system-ui, sans-serif;
    --card-border: #e1e4e8;
    --text-primary: #1f2937;
    --text-tertiary: #83899f;
  }
  body { margin: 0; padding: 20px; font-family: var(--font); background: white; color: var(--text-primary); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .swatch { display: flex; flex-direction: column; gap: 6px; }
  .chip {
    height: 64px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 13px;
    font-weight: 500;
  }
  .meta { display: flex; flex-direction: column; gap: 1px; }
  .name { font-size: 12px; color: var(--text-primary); font-weight: 500; }
  .role { font-size: 11px; color: var(--text-tertiary); }
  .hex { font-size: 11px; color: var(--text-tertiary); font-family: ui-monospace, monospace; }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch">
      <div class="chip" style="background: #10b981;">+9%</div>
      <div class="meta"><span class="name">Positive delta</span><span class="role">Up arrow, gains</span><span class="hex">#10b981</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: #800F2F;">-2%</div>
      <div class="meta"><span class="name">Negative delta</span><span class="role">Down arrow, losses</span><span class="hex">#800F2F</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: #2db463;">●</div>
      <div class="meta"><span class="name">Status indicator</span><span class="role">Sidebar "Last Update" dot</span><span class="hex">#2db463</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: #f8f9fa; color: #1f2937;">Active</div>
      <div class="meta"><span class="name">Active nav row</span><span class="role">Sidebar selected item</span><span class="hex">#f8f9fa</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: #1d3557;">RAW</div>
      <div class="meta"><span class="name">Brand text</span><span class="role">Wordmark, swap per client</span><span class="hex">#1d3557</span></div>
    </div>
  </div>
</body>
</html>
