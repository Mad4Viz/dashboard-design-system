<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --font: 'Open Sans', system-ui, sans-serif;
    --card-border: #e1e4e8;
    --canvas-bg: #f9fafb;
    --text-primary: #1f2937;
    --text-tertiary: #83899f;
  }
  body { margin: 0; padding: 20px; font-family: var(--font); background: white; color: var(--text-primary); }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .swatch { display: flex; flex-direction: column; gap: 6px; }
  .chip {
    height: 64px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
  }
  .meta { display: flex; flex-direction: column; gap: 1px; }
  .name { font-size: 12px; color: var(--text-primary); font-weight: 500; }
  .hex { font-size: 11px; color: var(--text-tertiary); font-family: ui-monospace, monospace; }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch">
      <div class="chip" style="background: #1f2937;"></div>
      <div class="meta"><span class="name">Text primary</span><span class="hex">#1f2937</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: #6b7280;"></div>
      <div class="meta"><span class="name">Text secondary</span><span class="hex">#6b7280</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: #83899f;"></div>
      <div class="meta"><span class="name">Text tertiary</span><span class="hex">#83899f</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: #f9fafb;"></div>
      <div class="meta"><span class="name">Canvas bg</span><span class="hex">#f9fafb</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: #fefefe;"></div>
      <div class="meta"><span class="name">Card bg</span><span class="hex">#fefefe</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: #e1e4e8;"></div>
      <div class="meta"><span class="name">Card border</span><span class="hex">#e1e4e8</span></div>
    </div>
  </div>
</body>
</html>
