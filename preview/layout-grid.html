<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&display=swap">
<style>
  body { margin: 0; padding: 18px; font-family: 'Open Sans', system-ui, sans-serif; background: white; color: #1f2937; }
  .frame {
    width: 100%;
    aspect-ratio: 1440 / 1024;
    max-height: 280px;
    position: relative;
    background: #f9fafb;
    border: 1px solid #e1e4e8;
    border-radius: 4px;
    overflow: hidden;
  }
  .sidebar { position: absolute; top: 0; left: 0; width: 16.67%; height: 100%; background: #fefefe; border-right: 1px solid #e1e4e8; }
  .sidebar-label { position: absolute; left: 6px; top: 4px; font-size: 9px; color: #83899f; }
  .header { position: absolute; top: 0; left: 16.67%; right: 0; height: 9.77%; background: transparent; border-bottom: 1px dashed #e1e4e8; }
  .header-label { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); font-size: 9px; color: #83899f; }
  .bands {
    position: absolute;
    left: calc(16.67% + 1.67%);
    right: 1.67%;
    top: 9.77%;
    bottom: 0;
    background:
      repeating-linear-gradient(
        to right,
        rgba(220, 80, 90, 0.18) 0,
        rgba(220, 80, 90, 0.18) 5.14%,
        transparent 5.14%,
        transparent 6.81%
      ),
      repeating-linear-gradient(
        to bottom,
        rgba(220, 80, 90, 0.10) 0,
        rgba(220, 80, 90, 0.10) 0.78%,
        transparent 0.78%,
        transparent 3.13%
      );
  }
  .specs {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 4px 18px;
    margin-top: 14px;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    color: #1f2937;
  }
  .specs .k { color: #83899f; }
</style>
</head>
<body>
  <div class="frame">
    <div class="sidebar"><span class="sidebar-label">240px sidebar</span></div>
    <div class="header"><span class="header-label">100px header</span></div>
    <div class="bands"></div>
  </div>
  <div class="specs">
    <span><span class="k">Canvas</span> 1440 × 1024</span><span><span class="k">Snap step</span> 8px</span>
    <span><span class="k">Columns</span> 12 × 74 + 24 gutters</span><span><span class="k">Row cycle</span> 8 + 24 = 32</span>
    <span><span class="k">Sidebar</span> 240 + 24 inset</span><span><span class="k">Right margin</span> 24</span>
  </div>
</body>
</html>
