<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KPI metric card - chart code</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0">

  <!--
    CHART 1 - KPI metric card (component type 4.1)
    Plain HTML+CSS. Not d3. First of five chart types for the Shopify
    Overview dashboard demo.

    Slot map:
      {label}           .kpi-label         14px, var(--text-secondary)
      {value}           .kpi-value         32px, var(--text-primary), 600
                        Vertically centred via margin: auto 0 so the
                        value sits in the middle of the card with
                        whitespace split equally above and below.
      {delta_direction} data-direction     on root element. Swaps the
                                           Material Symbols glyph
                                           (north_east vs south_east)
                                           and the change-text colour.
      {delta_value}     .kpi-delta-change  12px, colour follows direction.
                                           Sign prefix is part of the value
                                           (+9% for up, -2% for down).
      {delta_context}   .kpi-delta-context 12px, var(--text-tertiary)

    CP3 revisions to spec values:
      - KPI value size: 18px to 32px (Type role map at Section 1.2).
      - KPI padding: 16px to 24px on all sides (Section 4.1).
      - Delta value: signed prefix added (+/-) in addition to the arrow.

    Drop-in into template/index.html canvas:
      1. Outer element keeps BOTH classes: "component kpi-card".
         .component provides absolute position, drag, resize, dim label,
         and remove button. .kpi-card adds padding and the flex column.
      2. Copy any of the four KPI markups below inside the canvas.
      3. Set left/top via inline style to the slot position defined
         (e.g., left: 264px; top: 128px;).

    Why both classes on one element: matches the existing demo pattern
    at template/index.html line 661.
  -->

  <style>
    /* CSS variables mirror the design tokens,
       defaulted to spec values. When this file is dropped into the
       live demo, :root is already defined and these duplicates are
       harmless (same name + same value). */
    :root {
      --canvas-bg: #f9fafb;
      --card-bg: #fefefe;
      --card-border: #e1e4e8;
      --text-primary: #1f2937;
      --text-secondary: #6b7280;
      --text-tertiary: #83899f;
      --positive-delta: #10b981;
      --negative-delta: #800F2F;
      --font-family: 'Open Sans', system-ui, sans-serif;
      --size-xs: 12px;
      --size-sm: 14px;
      --size-kpi: 32px;
      --space-3: 24px;
      --radius-card: 8px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px;
      font-family: var(--font-family);
      background: var(--canvas-bg);
      color: var(--text-primary);
      display: flex;
      gap: var(--space-3);
      flex-wrap: wrap;
    }

    /* .component shim for the standalone preview.
       In the live demo, .component is already defined and adds
       position: absolute plus drag/resize/dim/remove wiring. Here
       we mimic only the visual parts so this file looks right when
       opened on its own. */
    .component {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-card);
      overflow: hidden;
      position: relative;
    }

    /* ============================================================
       KPI METRIC CARD (Section 4.1)
       Applied to the same element as .component.
       ============================================================ */
    .kpi-card {
      width: 270px;
      height: 160px;
      padding: var(--space-3);
      display: flex;
      flex-direction: column;
    }
    .kpi-label {
      font-size: var(--size-sm);
      color: var(--text-secondary);
      margin: 0;
      font-weight: 400;
      line-height: 1.3;
    }
    .kpi-value {
      font-size: var(--size-kpi);
      color: var(--text-primary);
      font-weight: 600;
      margin: auto 0;          /* vertically centred between label + delta */
      line-height: 1.15;
    }
    .kpi-delta {
      font-size: var(--size-xs);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      line-height: 1.3;
    }
    .kpi-delta-change {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--positive-delta);
      font-weight: 500;
    }
    /* Direction switch: data-direction="down" recolours the change
       span. The icon glyph is set separately in the HTML to avoid
       pseudo-element font-family edge cases with the Material
       Symbols variable font. */
    .kpi-card[data-direction="down"] .kpi-delta-change {
      color: var(--negative-delta);
    }
    .kpi-delta-icon {
      font-size: 14px;
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
    }
    .kpi-delta-context {
      color: var(--text-tertiary);
    }
  </style>
</head>
<body>

<!-- Four KPI instances from Shopify Overview (3).png.
     Values transcribed verbatim from the reference image.
     The delta sign convention (+ for positive, - for negative) was
     locked at CP3. -->

<div class="component kpi-card" data-direction="up">
  <p class="kpi-label">Profit</p>
  <p class="kpi-value">&pound;4.71M</p>
  <p class="kpi-delta">
    <span class="kpi-delta-change">
      <span class="material-symbols-outlined kpi-delta-icon">north_east</span>+9%
    </span>
    <span class="kpi-delta-context">Vs Last Year</span>
  </p>
</div>

<div class="component kpi-card" data-direction="up">
  <p class="kpi-label">Revenue</p>
  <p class="kpi-value">&pound;8.20M</p>
  <p class="kpi-delta">
    <span class="kpi-delta-change">
      <span class="material-symbols-outlined kpi-delta-icon">north_east</span>+15%
    </span>
    <span class="kpi-delta-context">Vs Last Year</span>
  </p>
</div>

<div class="component kpi-card" data-direction="up">
  <p class="kpi-label">Orders Fulfilled</p>
  <p class="kpi-value">94K</p>
  <p class="kpi-delta">
    <span class="kpi-delta-change">
      <span class="material-symbols-outlined kpi-delta-icon">north_east</span>+23%
    </span>
    <span class="kpi-delta-context">Vs Last Year</span>
  </p>
</div>

<div class="component kpi-card" data-direction="down">
  <p class="kpi-label">Returning Customer Rate</p>
  <p class="kpi-value">66%</p>
  <p class="kpi-delta">
    <span class="kpi-delta-change">
      <span class="material-symbols-outlined kpi-delta-icon">south_east</span>-2%
    </span>
    <span class="kpi-delta-context">Vs Last Year</span>
  </p>
</div>

</body>
</html>
